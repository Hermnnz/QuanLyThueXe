services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanlythuexe/odoo:18.0-fixed
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: odoo_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://web:8069
    depends_on:
      - web

volumes:
  odoo-web-data:
  odoo-db-data:
